modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="Dynamic Trees Addon Lib"

issueTrackerURL="https://github.com/DynamicTreesTeam/DynamicTrees-AddonLib/issues"
displayURL="https://www.curseforge.com/minecraft/mc-mods/dynamic-trees-addon-lib"
logoFile="logo.png"

authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="dynamictrees"
    type="required"
    versionRange="[1.8.0-BETA04,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="dynamictreesplus"
    type="optional"
    versionRange="[1.3.1,)"
    ordering="AFTER"
    side="BOTH"
